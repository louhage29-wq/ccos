<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeCanvas OS</title>
<style>
:root{
  --accent:#6af5c8;
  --panel:#101b2b;
  --panel2:#17253a;
  --window-bg:rgba(16,27,43,.95);
  --text:#eef7ff;
  --muted:#91a5bb;
  --danger:#ff6175;
  --taskbar:50px;
  --ui-blur:18px;
  --wallpaper:
    radial-gradient(circle at 18% 15%,#174c62 0,transparent 34%),
    radial-gradient(circle at 88% 80%,#283d7d 0,transparent 39%),
    linear-gradient(135deg,#07101c,#111d35 58%,#07101c);
}
*{box-sizing:border-box}
html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#03070d;
  color:var(--text);
  font:14px Inter,Segoe UI,Arial,sans-serif;
}
body.light{
  --panel:#f7faff;
  --panel2:#e4edf7;
  --text:#142033;
  --muted:#617188;
}
body.contrast{
  --panel:#050505;
  --panel2:#111;
  --text:#fff;
  --muted:#ddd;
  --accent:#fff500;
  --wallpaper:#000;
}
body.reduce-motion *{
  animation:none!important;
  transition:none!important;
}
body.no-blur *{
  backdrop-filter:none!important;
  -webkit-backdrop-filter:none!important;
}
body.square-corners button,
body.square-corners input,
body.square-corners textarea,
body.square-corners select,
body.square-corners .card,
body.square-corners .widget,
body.square-corners .window,
body.square-corners .window iframe,
body.square-corners #startMenu,
body.square-corners #contextMenu,
body.square-corners .toast,
body.square-corners .file-row,
body.square-corners .output{
  border-radius:0!important;
}
button,input,textarea,select{font:inherit}
button{
  padding:8px 11px;
  color:var(--text);
  background:#ffffff0d;
  border:1px solid #ffffff20;
  border-radius:8px;
  cursor:pointer;
}
button:hover{background:#ffffff1c}
button.primary{
  color:#04120e;
  background:var(--accent);
  border-color:transparent;
  font-weight:700;
}
button.danger{
  color:#ff9eaa;
  background:#ff617522;
  border-color:#ff617555;
}
input,textarea,select{
  width:100%;
  padding:9px;
  color:var(--text);
  background:#0003;
  border:1px solid #ffffff20;
  border-radius:8px;
  outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:100px}
h1,h2,h3,p{margin-top:0}
img{max-width:100%}
.hidden{display:none!important}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.grid{display:grid;gap:10px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{
  padding:12px;
  background:#ffffff09;
  border:1px solid #ffffff14;
  border-radius:10px;
}
.muted{color:var(--muted)}
.small{font-size:12px}
.setting-value{
  display:inline-block;
  min-width:42px;
  text-align:right;
  color:var(--accent);
}
.output{
  min-height:100px;
  padding:10px;
  overflow:auto;
  color:#b0ffda;
  background:#030812;
  border:1px solid #ffffff16;
  border-radius:8px;
}
.app-fill{
  height:100%;
  display:flex;
  flex-direction:column;
  gap:9px;
}
.file-list{display:grid;gap:6px}
.file-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:9px;
  background:#ffffff09;
  border-radius:8px;
}
.app-icon-render{
  width:32px;
  height:32px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:none;
  font-size:27px;
}
.app-icon-render img{
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:7px;
}
#desktop{
  position:fixed;
  inset:0 0 var(--taskbar);
  overflow:hidden;
  user-select:none;
  background:var(--wallpaper);
  background-size:cover;
}
#desktop:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(120deg,#ffffff05,transparent 35%,#ffffff03);
}
#desktopIcons{
  position:absolute;
  z-index:2;
  inset:0;
}
.desktop-icon{
  position:absolute;
  width:84px;
  min-height:82px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:5px;
  padding:5px;
  text-align:center;
  border:1px solid transparent;
  border-radius:8px;
  text-shadow:0 2px 5px #000;
  cursor:default;
  touch-action:none;
}
.desktop-icon:hover,.desktop-icon.selected{
  background:#ffffff17;
  border-color:#ffffff2a;
}
.desktop-icon .app-icon-render{
  width:38px;
  height:38px;
  font-size:30px;
}
.icon-name{
  max-width:80px;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:12px;
}
#selectionBox{
  position:absolute;
  z-index:1;
  display:none;
  background:#6af5c822;
  border:1px solid var(--accent);
}
#widgets{
  position:absolute;
  z-index:3;
  top:14px;
  right:14px;
  width:230px;
  display:grid;
  gap:9px;
}
.widget{
  padding:12px;
  background:#0a1525dd;
  border:1px solid #ffffff18;
  border-radius:12px;
  box-shadow:0 10px 30px #0005;
  backdrop-filter:blur(var(--ui-blur));
  -webkit-backdrop-filter:blur(var(--ui-blur));
}
body.light .widget{background:#f7fbffdd}
.widget-time{font-size:30px;font-weight:700}
.sticky textarea{
  min-height:82px;
  color:#332b00;
  background:#ffe989;
  border:0;
}
#taskbar{
  position:fixed;
  z-index:9000;
  left:0;
  right:0;
  bottom:0;
  height:var(--taskbar);
  display:flex;
  align-items:center;
  gap:6px;
  padding:5px 8px;
  background:#091321ed;
  border-top:1px solid #ffffff18;
  backdrop-filter:blur(var(--ui-blur));
  -webkit-backdrop-filter:blur(var(--ui-blur));
}
body.light #taskbar{background:#f4f8fced}
#startButton{width:40px;padding:5px;font-size:21px}
#taskButtons{
  display:flex;
  flex:1;
  gap:5px;
  overflow:auto;
}
.task-button{
  max-width:170px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.task-button.active{
  background:#ffffff20;
  border-bottom:2px solid var(--accent);
}
#tray{display:flex;align-items:center;gap:7px}
#clock{min-width:82px;text-align:right;font-size:12px}
#startMenu{
  position:fixed;
  z-index:9500;
  left:8px;
  bottom:calc(var(--taskbar) + 6px);
  width:410px;
  max-height:74vh;
  padding:13px;
  overflow:auto;
  background:#0a1525f2;
  border:1px solid #ffffff20;
  border-radius:15px;
  box-shadow:0 20px 65px #000b;
  backdrop-filter:blur(var(--ui-blur));
  -webkit-backdrop-filter:blur(var(--ui-blur));
}
body.light #startMenu{background:#f7fafff2}
#startApps{grid-template-columns:repeat(4,minmax(0,1fr))}
.start-app{
  min-height:78px;
  padding:8px 3px;
  text-align:center;
}
.start-app .app-icon-render{
  width:34px;
  height:34px;
  margin:0 auto 4px;
}
.start-app small{font-size:11px}
#searchResults{display:grid;gap:5px;margin-top:8px}
.search-result{text-align:left}
.start-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:12px;
}
.window{
  position:absolute;
  z-index:20;
  min-width:290px;
  min-height:190px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  resize:both;
  background:var(--window-bg);
  border:1px solid #ffffff24;
  border-radius:12px;
  box-shadow:0 20px 60px #0009;
  user-select:text;
  backdrop-filter:blur(var(--ui-blur));
  -webkit-backdrop-filter:blur(var(--ui-blur));
}
.window.focused{border-color:#ffffff55}
.window.pinned{border-color:var(--accent)}
.window.minimized{display:none}
.window.maximized{
  top:0!important;
  left:0!important;
  width:100%!important;
  height:100%!important;
  border-radius:0;
  resize:none;
}
.titlebar{
  height:40px;
  flex:none;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 7px 0 10px;
  background:#ffffff09;
  border-bottom:1px solid #ffffff14;
  cursor:move;
  user-select:none;
}
.titlebar .app-icon-render{
  width:24px;
  height:24px;
  font-size:19px;
}
.window-title{
  flex:1;
  font-weight:650;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.window-controls{display:flex;gap:2px}
.window-controls button{
  padding:4px 8px;
  background:transparent;
  border:0;
}
.window-controls .close:hover{
  color:#fff;
  background:var(--danger);
}
.window-body{
  position:relative;
  flex:1;
  padding:13px;
  overflow:auto;
}
.window iframe{
  width:100%;
  height:100%;
  min-height:320px;
  background:#fff;
  border:0;
  border-radius:8px;
}
.terminal{
  height:100%;
  padding:10px;
  overflow:auto;
  color:#7dffae;
  background:#020805;
  border-radius:8px;
  font:13px monospace;
  white-space:pre-wrap;
}
.terminal-input{font-family:monospace}
.calc-display{text-align:right;font-size:26px}
.calc-grid{grid-template-columns:repeat(4,1fr)}
.calc-grid button{padding:13px}
.canvas-wrap{
  flex:1;
  overflow:auto;
  text-align:center;
  background:#fff;
  border-radius:8px;
}
canvas.paint{
  display:block;
  max-width:100%;
  background:#fff;
  cursor:crosshair;
  touch-action:none;
}
.wallpaper-option{
  height:70px;
  border:2px solid transparent;
  border-radius:8px;
  cursor:pointer;
}
.wallpaper-option.selected,
.wallpaper-option:hover{border-color:var(--accent)}
.manager-preview{
  width:48px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  background:#0003;
  border-radius:9px;
}
.manager-preview img{
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:9px;
}
#contextMenu{
  position:fixed;
  z-index:9700;
  min-width:205px;
  padding:6px;
  background:#0a1525f5;
  border:1px solid #ffffff20;
  border-radius:9px;
  box-shadow:0 15px 45px #000b;
  backdrop-filter:blur(var(--ui-blur));
  -webkit-backdrop-filter:blur(var(--ui-blur));
}
#contextMenu button{
  display:block;
  width:100%;
  text-align:left;
  background:transparent;
  border:0;
}
#notifications{
  position:fixed;
  z-index:9800;
  right:12px;
  bottom:calc(var(--taskbar) + 8px);
  width:310px;
  display:grid;
  gap:8px;
  pointer-events:none;
}
.toast{
  padding:11px;
  background:#0a1525f2;
  border:1px solid #ffffff20;
  border-left:3px solid var(--accent);
  border-radius:10px;
  box-shadow:0 15px 40px #0009;
  backdrop-filter:blur(var(--ui-blur));
  -webkit-backdrop-filter:blur(var(--ui-blur));
}
#lockScreen,#shutdownScreen{
  position:fixed;
  inset:0;
  z-index:15000;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
}
#lockScreen{background:var(--wallpaper)}
#shutdownScreen{background:#000}
.lock-time{font-size:70px;font-weight:300}
.lock-date{margin-bottom:28px;font-size:18px}
.external-app-root{
  width:100%;
  height:100%;
  padding:14px;
  overflow:auto;
  background:var(--panel);
}
@media(max-width:700px){
  #widgets{display:none!important}
  #startMenu{width:calc(100% - 16px)}
  .window{min-width:255px}
  .grid.two,.grid.three{grid-template-columns:1fr}
}
</style>
</head>
<body>
<script id="codecanvasEmbeddedState" type="application/json">{}</script>
<main id="desktop">
  <div id="desktopIcons"></div>
  <div id="selectionBox"></div>
  <aside id="widgets">
    <div class="widget">
      <div class="widget-time" id="widgetTime">CodeCanvas</div>
      <div class="muted" id="widgetDate">Workspace ready</div>
    </div>
<div class="widget">
  <strong>System</strong>
  <div class="small muted" id="systemStatus">CodeCanvas OS is ready.</div>
</div>

<div class="widget sticky">
  <strong>Sticky note</strong>
  <textarea id="stickyNote" placeholder="Write something…"></textarea>
</div>

  </aside>
</main>
<nav id="taskbar">
  <button id="startButton" title="Start">◈</button>
  <button id="desktopButton" title="Switch desktop">▦</button>
  <div id="taskButtons"></div>
  <div id="tray">
    <button id="notificationButton" title="Notifications">◉</button>
    <span id="desktopIndicator" class="small">Desk 1</span>
    <div id="clock">Ready</div>
  </div>
</nav>
<section id="startMenu" class="hidden">
  <h2>CodeCanvas OS</h2>
  <input id="appSearch" placeholder="Search apps…">
  <div id="searchResults"></div>
  <h3>Applications</h3>
  <div id="startApps" class="grid"></div>
  <div class="start-footer">
    <span class="muted">Local workspace</span>
    <div class="row">
      <button id="lockButton">Lock</button>
      <button id="powerButton">Power</button>
    </div>
  </div>
</section>
<div id="contextMenu" class="hidden"></div>
<div id="notifications"></div>
<div id="lockScreen">
  <div class="lock-time" id="lockTime"></div>
  <div class="lock-date" id="lockDate"></div>
  <button class="primary" id="unlockButton">Unlock CodeCanvas OS</button>
</div>
<div id="shutdownScreen">
  <h1>CodeCanvas OS is shut down.</h1>
  <button id="powerOnButton">Power on</button>
</div>
<input id="stateImporter" class="hidden" type="file" accept=".json">
<script>
(function(){
"use strict";

var prefix="codecanvas_os_";
var memoryStore={};
var embeddedState={};

try{
  embeddedState=JSON.parse(
    document.getElementById("codecanvasEmbeddedState").textContent || "{}"
  );
}catch(error){
  embeddedState={};
}

function installEmbeddedState(){
  if(!embeddedState || !embeddedState.exportId || !embeddedState.data) return;

  var marker=prefix+"installed_export";
  var installed="";

  try{
    installed=localStorage.getItem(marker) || "";
  }catch(error){}

  if(installed===embeddedState.exportId) return;

  Object.keys(embeddedState.data).forEach(function(key){
    try{
      localStorage.setItem(
        prefix+key,
        JSON.stringify(embeddedState.data[key])
      );
    }catch(error){
      memoryStore[key]=embeddedState.data[key];
    }
  });

  try{
    localStorage.setItem(marker,embeddedState.exportId);
  }catch(error){}
}

installEmbeddedState();

function loadData(key,fallback){
  try{
    var value=localStorage.getItem(prefix+key);
    return value===null ? fallback : JSON.parse(value);
  }catch(error){
    return Object.prototype.hasOwnProperty.call(memoryStore,key)
      ? memoryStore[key]
      : fallback;
  }
}

function saveData(key,value){
  memoryStore[key]=value;

  try{
    localStorage.setItem(prefix+key,JSON.stringify(value));
    return true;
  }catch(error){
    notify(
      "Storage warning",
      "Browser storage is full. Export a portable save before closing."
    );
    return false;
  }
}

function clearData(){
  try{
    var keys=[];
    var i;

    for(i=0;i<localStorage.length;i++){
      var key=localStorage.key(i);
      if(key && key.indexOf(prefix)===0) keys.push(key);
    }

    keys.forEach(function(key){
      localStorage.removeItem(key);
    });
  }catch(error){}

  memoryStore={};
}

function $(selector,root){
  var element=(root || document).querySelector(selector);

  if(!element && String(selector).indexOf("[data-context=")===0){
    return {onclick:null};
  }

  return element;
}

function $all(selector,root){
  return Array.prototype.slice.call(
    (root || document).querySelectorAll(selector)
  );
}

function escapeHTML(value){
  var element=document.createElement("div");
  element.textContent=String(value===undefined ? "" : value);
  return element.innerHTML;
}

function makeId(label){
  return String(label || "item")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,"_")
    .replace(/^_+|_+$/g,"")+
    "_"+
    Math.random().toString(36).slice(2,8);
}

function download(name,text,type){
  var blob=new Blob([text],{type:type || "text/plain"});
  var url=URL.createObjectURL(blob);
  var link=document.createElement("a");

  link.href=url;
  link.download=name;
  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(function(){
    URL.revokeObjectURL(url);
  },1200);
}

function readFileAsText(file,callback){
  var reader=new FileReader();

  reader.onload=function(){
    callback(String(reader.result || ""));
  };

  reader.readAsText(file);
}

function readFileAsDataURL(file,callback){
  var reader=new FileReader();

  reader.onload=function(){
    callback(String(reader.result || ""));
  };

  reader.readAsDataURL(file);
}

function hexToRgba(hex,alpha){
  var value=String(hex || "").replace("#","");

  if(value.length===3){
    value=value.split("").map(function(character){
      return character+character;
    }).join("");
  }

  var number=parseInt(value,16);

  if(Number.isNaN(number)){
    return "rgba(16,27,43,"+alpha+")";
  }

  return "rgba("+
    ((number>>16)&255)+","+
    ((number>>8)&255)+","+
    (number&255)+","+
    alpha+
  ")";
}

function getTaskbarHeight(){
  return parseInt(
    getComputedStyle(document.documentElement)
      .getPropertyValue("--taskbar"),
    10
  ) || 50;
}

var wallpapers=[
  "radial-gradient(circle at 18% 15%,#174c62 0,transparent 34%),radial-gradient(circle at 88% 80%,#283d7d 0,transparent 39%),linear-gradient(135deg,#07101c,#111d35 58%,#07101c)",
  "radial-gradient(circle at 50% 120%,#ff7c5c 0,transparent 48%),linear-gradient(150deg,#351849,#15172f 60%,#08111e)",
  "linear-gradient(130deg,#051b14,#0c3f30 45%,#05110d)",
  "radial-gradient(circle at 30% 30%,#293d67,transparent 30%),linear-gradient(145deg,#06080f,#171b2a)",
  "radial-gradient(circle at 80% 15%,#6a174f 0,transparent 32%),radial-gradient(circle at 20% 85%,#194d79 0,transparent 38%),linear-gradient(145deg,#120817,#17162e)",
  "linear-gradient(135deg,#1f2c44 0 25%,#243753 25% 50%,#17263e 50% 75%,#20324b 75%)"
];

var defaultSettings={
  theme:"dark",
  accent:"#6af5c8",
  wallpaper:0,
  widgets:true,
  contrast:false,
  reducedMotion:false,
  blurEffects:true,
  roundedCorners:true,
  fontSize:14,
  windowOpacity:95,
  taskbarSize:"normal",
  clock24:false,
  showSeconds:false,
  defaultOpenMode:"window",
  startupApp:"",
  startupNotification:true
};

var settings=Object.assign(
  {},
  defaultSettings,
  loadData("settings",{})
);

var files=loadData("files",{
  "Welcome.txt":
    "Welcome to CodeCanvas OS.\n\nUse App Manager to install HTML applications.",
  "Example.html":
    "<!DOCTYPE html><html><head><title>Example</title></head><body style='font-family:Arial;padding:30px'><h1>Hello from CodeCanvas OS</h1><p>Edit this page in CodeCanvas Embedder.</p></body></html>"
});

var notes=loadData("notes",[
  {
    id:makeId("note"),
    name:"Welcome",
    text:"CodeCanvas OS is ready."
  }
]);

var bookmarks=loadData("bookmarks",[
  "about:blank",
  "https://example.com"
]);

var contacts=loadData("contacts",[]);
var recycleBin=loadData("recycleBin",[]);
var customApps=loadData("customApps",[]);
var appCustomizations=loadData("appCustomizations",{});
var desktopPositions=loadData("desktopPositions",{});
var notificationHistory=loadData("notifications",[]);

var activeWindow=null;
var currentDesktop=0;
var zIndex=30;

function applySettings(){
  var taskbarSizes={
    compact:42,
    normal:50,
    large:62
  };

  var basePanel=settings.contrast
    ? "#050505"
    : settings.theme==="light"
      ? "#f7faff"
      : "#101b2b";

  document.body.classList.toggle("light",settings.theme==="light");
  document.body.classList.toggle("contrast",settings.contrast);
  document.body.classList.toggle("reduce-motion",settings.reducedMotion);
  document.body.classList.toggle("no-blur",!settings.blurEffects);
  document.body.classList.toggle("square-corners",!settings.roundedCorners);

  document.body.style.fontSize=
    Math.max(12,Math.min(18,Number(settings.fontSize) || 14))+
    "px";

  document.documentElement.style.setProperty(
    "--accent",
    settings.accent
  );

  document.documentElement.style.setProperty(
    "--wallpaper",
    wallpapers[settings.wallpaper] || wallpapers[0]
  );

  document.documentElement.style.setProperty(
    "--taskbar",
    (taskbarSizes[settings.taskbarSize] || 50)+"px"
  );

  document.documentElement.style.setProperty(
    "--ui-blur",
    settings.blurEffects ? "18px" : "0px"
  );

  document.documentElement.style.setProperty(
    "--window-bg",
    hexToRgba(
      basePanel,
      Math.max(
        0.55,
        Math.min(1,(Number(settings.windowOpacity) || 95)/100)
      )
    )
  );

  if(/^data:image\//i.test(icon) || /^https?:\/\//i.test(icon)){

        "<img src='"+escapeHTML(icon)+"' alt=''>"+

    );

function appDetails(appId){
  var app=apps[appId];
  if(!app) return null;

  var customization=appCustomizations[appId] || {};

  return {
    id:appId,
    name:customization.name || app.name,
    icon:customization.icon || app.icon,
    width:app.width || 650,
    height:app.height || 480,
    render:app.render,
    custom:!!app.custom,
    openMode:
      customization.openMode ||
      settings.defaultOpenMode ||
      "window"
  };
}

function defaultPosition(index){
  return {
    x:12+(index%2)*90,
    y:12+Math.floor(index/2)*88
  };
}

function clampIconPosition(position){
  return {
    x:Math.max(
      0,
      Math.min(window.innerWidth-88,Number(position.x) || 0)
    ),
    y:Math.max(
      0,
      Math.min(
        window.innerHeight-getTaskbarHeight()-90,
        Number(position.y) || 0
      )
    )
  };
}

function getAppPosition(appId,index){
  return clampIconPosition(
    desktopPositions[appId] || defaultPosition(index)
  );
}

function setAppPosition(appId,x,y){
  desktopPositions[appId]=clampIconPosition({x:x,y:y});
  saveData("desktopPositions",desktopPositions);
}

function setupDesktopIcon(icon){
var appId=icon.getAttribute("data-desktop-app");
var dragging=false;
var moved=false;
var startX=0;
var startY=0;
var originalX=0;
var originalY=0;
icon.addEventListener("dblclick",function(){
if(!moved) launchApp(appId);
});
icon.addEventListener("click",function(){
$all(".desktop-icon").forEach(function(other){
other.classList.remove("selected");
});
icon.classList.add("selected");

});
icon.addEventListener("pointerdown",function(event){
if(event.button!==0) return;
dragging=true;
moved=false;
startX=event.clientX;
startY=event.clientY;
originalX=icon.offsetLeft;
originalY=icon.offsetTop;
icon.setPointerCapture(event.pointerId);

});
icon.addEventListener("pointermove",function(event){
if(!dragging) return;
var dx=event.clientX-startX;
var dy=event.clientY-startY;

if(Math.abs(dx)>3 || Math.abs(dy)>3) moved=true;

var position=clampIconPosition({
  x:originalX+dx,
  y:originalY+dy
});

icon.style.left=position.x+"px";
icon.style.top=position.y+"px";

});
icon.addEventListener("pointerup",function(){
if(!dragging) return;
dragging=false;

if(moved){
  setAppPosition(appId,icon.offsetLeft,icon.offsetTop);
}

});
icon.addEventListener("pointercancel",function(){
dragging=false;
});
}

function setupWindow(win){
var titlebar=$(".titlebar",win);
var dragging=false;
var offsetX=0;
var offsetY=0;
titlebar.addEventListener("pointerdown",function(event){
if(event.target.closest("button")) return;
if(win.classList.contains("maximized")) return;
dragging=true;
offsetX=event.clientX-win.offsetLeft;
offsetY=event.clientY-win.offsetTop;

focusWindow(win);
titlebar.setPointerCapture(event.pointerId);

});
titlebar.addEventListener("pointermove",function(event){
if(!dragging) return;
win.style.left=Math.max(
  0,
  Math.min(
    window.innerWidth-win.offsetWidth,
    event.clientX-offsetX
  )
)+"px";

win.style.top=Math.max(
  0,
  Math.min(
    window.innerHeight-getTaskbarHeight()-win.offsetHeight,
    event.clientY-offsetY
  )
)+"px";

});
titlebar.addEventListener("pointerup",function(){
dragging=false;
});
titlebar.addEventListener("pointercancel",function(){
dragging=false;
});
win.addEventListener("pointerdown",function(){
focusWindow(win);
});
$all("[data-window-action]",win).forEach(function(button){
button.addEventListener("click",function(event){
event.stopPropagation();
  var action=button.getAttribute("data-window-action");

  if(action==="close"){
    closeWindow(win.id);
  }

  if(action==="minimize"){
    win.classList.add("minimized");

    if(activeWindow===win){
      activeWindow=null;
    }

    renderTaskbar();
  }

  if(action==="maximize"){
    win.classList.toggle("maximized");
    focusWindow(win);
  }

  if(action==="pin"){
    win.classList.toggle("pinned");

    if(win.classList.contains("pinned")){
      win.setAttribute("data-pinned","true");
      notify("Window pinned","Visible on every desktop.");
    }else{
      win.removeAttribute("data-pinned");
    }
  }

  if(action==="external"){
    openAppInBlank(win.getAttribute("data-app"));

    if(
      appDetails(win.getAttribute("data-app")) &&
      appDetails(win.getAttribute("data-app")).openMode==="blank"
    ){
      closeWindow(win.id);
    }
  }
});

});
}
function focusWindow(win){
if(!win) return;
$all(".window").forEach(function(item){
item.classList.remove("focused");
});
activeWindow=win;
win.classList.remove("minimized");
win.classList.add("focused");
win.style.zIndex=String(++zIndex);
renderTaskbar();
}
function closeWindow(windowId){
var win=document.getElementById(windowId);
if(!win) return;
win.remove();
if(activeWindow===win){
activeWindow=null;
}
renderTaskbar();
updateClock();
}
function renderTaskbar(){
var visibleWindows=$all(".window").filter(function(win){
return (
Number(win.getAttribute("data-desktop"))===currentDesktop ||
win.getAttribute("data-pinned")==="true"
);
});
$("#taskButtons").innerHTML=visibleWindows.map(function(win){
var app=appDetails(win.getAttribute("data-app"));
if(!app) return "";
return (
  "<button class='task-button "+
    (win===activeWindow ? "active" : "")+
    "' data-task-window='"+win.id+"'>"+
    escapeHTML(app.name)+
  "</button>"
);

}).join("");
$all("[data-task-window]").forEach(function(button){
button.addEventListener("click",function(){
var win=document.getElementById(
button.getAttribute("data-task-window")
);
  if(!win) return;

  if(win===activeWindow && !win.classList.contains("minimized")){
    win.classList.add("minimized");
    activeWindow=null;
  }else{
    focusWindow(win);
  }

  renderTaskbar();
});

});
}

function normalizeAppURL(value){
  value=String(value || "").trim();

  if(!value) return "";

  if(
    /^about:/i.test(value) ||
    /^data:/i.test(value) ||
    /^blob:/i.test(value) ||
    /^[a-z][a-z0-9+.-]*:\/\//i.test(value)
  ){
    return value;
  }

  return "https://"+value;
}

};

  print("help, apps, open, openblank, file, date, clean, desktop, export, whoami");

  if(apps[argument]){
    openAppInBlank(argument);
  }else{
    print("App not found.");
  }

  print(Object.keys(files).join(", "));

  print(
    Object.prototype.hasOwnProperty.call(files,argument)
      ? files[argument]
      : "File not found."

  print(new Date().toString());

  output.textContent="";

  print(argument);

  switchDesktop(
    Math.max(0,Math.min(2,(Number(argument) || 1)-1))
  );
}else if(command==="export"){
  exportPortableOS();

function renderCalculator(body){
var keys=[
"C","(",")","÷",
"7","8","9","×",
"4","5","6","-",
"1","2","3","+",
"0",".","⌫","="
];
body.innerHTML=
"<div class='app-fill'>"+
"<input class='calc-display' readonly value='0'>"+
"<div class='grid calc-grid grow'>"+
keys.map(function(key){
return (
"<button data-calc='"+escapeHTML(key)+"'>"+
key+
"</button>"
);
}).join("")+
"</div>"+
"</div>";
var display=$(".calc-display",body);
var expression="";
$all("[data-calc]",body).forEach(function(button){
button.onclick=function(){
var key=button.getAttribute("data-calc");
  if(key==="C"){
    expression="";
  }else if(key==="⌫"){
    expression=expression.slice(0,-1);
  }else if(key==="="){
    try{
      var safe=expression
        .replace(/×/g,"*")
        .replace(/÷/g,"/");

      if(!/^[0-9+\-*/().\s]+$/.test(safe)){
        throw new Error("Invalid expression");
      }

      expression=String(
        Function('"use strict";return ('+safe+')')()
      );
    }catch(error){
      expression="Error";
    }
  }else{
    if(expression==="Error"){
      expression="";
    }

    expression+=key;
  }

  display.value=expression || "0";
};

});
}
function renderPaint(body){
body.innerHTML=
"<div class='app-fill'>"+
"<div class='row wrap'>"+
"<input class='paint-color' type='color' value='#101820' style='width:52px'>"+
"<input class='paint-size' type='range' min='1' max='40' value='5'>"+
"<button data-paint='clear'>Clear</button>"+
"<button data-paint='save'>Save PNG</button>"+
"</div>"+
"<div class='canvas-wrap'>"+
"<canvas class='paint' width='900' height='600'></canvas>"+
"</div>"+
"</div>";
var canvas=$("canvas",body);
var context=canvas.getContext("2d");
var drawing=false;
context.fillStyle="#fff";
context.fillRect(0,0,canvas.width,canvas.height);
function point(event){
var rect=canvas.getBoundingClientRect();
return {
  x:(event.clientX-rect.left)*canvas.width/rect.width,
  y:(event.clientY-rect.top)*canvas.height/rect.height
};

}
canvas.onpointerdown=function(event){
var location=point(event);
drawing=true;
context.beginPath();
context.moveTo(location.x,location.y);

canvas.setPointerCapture(event.pointerId);

};
canvas.onpointermove=function(event){
if(!drawing) return;
var location=point(event);

context.lineWidth=$(".paint-size",body).value;
context.lineCap="round";
context.strokeStyle=$(".paint-color",body).value;
context.lineTo(location.x,location.y);
context.stroke();

};
canvas.onpointerup=function(){
drawing=false;
};
canvas.onpointercancel=function(){
drawing=false;
};
$("[data-paint='clear']",body).onclick=function(){
context.fillStyle="#fff";
context.fillRect(0,0,canvas.width,canvas.height);
};
$("[data-paint='save']",body).onclick=function(){
var link=document.createElement("a");
link.href=canvas.toDataURL("image/png");
link.download="codecanvas-drawing.png";
link.click();

};
}

"</div>";
$("[data-about='embedder']",body).onclick=function(){
launchApp("studio");
};
$("[data-about='manager']",body).onclick=function(){
launchApp("appmanager");
};
$("[data-about='settings']",body).onclick=function(){
launchApp("settings");
};
}
$("#stateImporter").onchange=function(event){
var file=event.target.files[0];
if(!file) return;
readFileAsText(file,function(text){
try{
importStateObject(JSON.parse(text));
}catch(error){
notify(
"Import failed",
"The selected file is not a valid save."
);
}
});
event.target.value="";
};
$("#startButton").onclick=function(event){
event.stopPropagation();
$("#startMenu").classList.toggle("hidden");
if(!$("#startMenu").classList.contains("hidden")){
$("#appSearch").focus();
}
};
$("#desktopButton").onclick=function(){
switchDesktop((currentDesktop+1)%3);
};
$("#lockButton").onclick=function(){
$("#startMenu").classList.add("hidden");
$("#lockScreen").style.display="flex";
};
$("#unlockButton").onclick=function(){
$("#lockScreen").style.display="none";
};
$("#powerButton").onclick=function(){
var action=prompt(
"Type lock, restart, or shutdown",
"lock"
);
if(!action) return;
action=action.toLowerCase();
if(action==="lock"){
$("#lockButton").click();
}
if(action==="restart"){
location.reload();
}
if(action==="shutdown"){
$("#shutdownScreen").style.display="flex";
}
};
$("#powerOnButton").onclick=function(){
$("#shutdownScreen").style.display="none";
};
$("#notificationButton").onclick=function(){
if(!notificationHistory.length){
notify("CodeCanvas OS","No saved notifications.");
}else{
notify(
notificationHistory[0].title,
notificationHistory[0].message
);
}
};
$("#appSearch").oninput=function(event){
var query=event.target.value.toLowerCase().trim();
if(!query){
$("#searchResults").innerHTML="";
return;
}
var matching=Object.keys(apps).filter(function(appId){
return (
appDetails(appId).name.toLowerCase().indexOf(query)!==-1
);
});
$("#searchResults").innerHTML=matching.map(function(appId){
var app=appDetails(appId);
return (
  "<button class='search-result' data-search-app='"+escapeHTML(appId)+"'>"+
    escapeHTML(app.name)+
  "</button>"
);

}).join("");
$all("[data-search-app]").forEach(function(button){
button.onclick=function(){
launchApp(button.getAttribute("data-search-app"));
};
});
};
document.addEventListener("pointerdown",function(event){
if(
!event.target.closest("#startMenu") &&
!event.target.closest("#startButton")
){
$("#startMenu").classList.add("hidden");
}
if(!event.target.closest("#contextMenu")){
$("#contextMenu").classList.add("hidden");
}
});
$("#desktop").addEventListener("contextmenu",function(event){
if(event.target.closest(".window")) return;
event.preventDefault();
var menu=$("#contextMenu");
menu.style.left=
Math.min(event.clientX,window.innerWidth-220)+"px";
menu.style.top=
Math.min(event.clientY,window.innerHeight-290)+"px";
menu.innerHTML=
"<button data-context='manager'>Install or customize apps</button>"+
"<button data-context='export'>Export portable OS</button>"+
"<button data-context='settings'>Personalize</button>";
menu.classList.remove("hidden");
$("[data-context='studio']",menu).onclick=function(){
launchApp("studio");
};
$("[data-context='studio-blank']",menu).onclick=function(){
openAppInBlank("studio");
};
$("[data-context='manager']",menu).onclick=function(){
launchApp("appmanager");
};
$("[data-context='export']",menu).onclick=exportPortableOS;
$("[data-context='settings']",menu).onclick=function(){
launchApp("settings");
};
$("[data-context='icons']",menu).onclick=function(){
desktopPositions={};
saveData("desktopPositions",desktopPositions);
renderLaunchers();
notify(
  "Desktop layout",
  "Icon locations were reset."
);

};
});
document.addEventListener("keydown",function(event){
if(event.ctrlKey && event.code==="Space"){
event.preventDefault();
$("#startButton").click();
}
if(
event.altKey &&
event.key.toLowerCase()==="w" &&
activeWindow
){
event.preventDefault();
closeWindow(activeWindow.id);
}
if(
event.ctrlKey &&
event.altKey &&
event.key==="ArrowRight"
){
event.preventDefault();
switchDesktop((currentDesktop+1)%3);
}
if(
event.ctrlKey &&
event.altKey &&
event.key.toLowerCase()==="c"
){
event.preventDefault();
launchApp("studio");
}
if(
event.ctrlKey &&
event.altKey &&
event.key.toLowerCase()==="a"
){
event.preventDefault();
launchApp("appmanager");
}
if(
event.ctrlKey &&
event.altKey &&
event.key.toLowerCase()==="t"
){
event.preventDefault();
launchApp("terminal");
}
if(
event.ctrlKey &&
event.altKey &&
event.key.toLowerCase()==="s"
){
event.preventDefault();
launchApp("settings");
}
if(
event.ctrlKey &&
event.shiftKey &&
event.key.toLowerCase()==="e"
){
event.preventDefault();
exportPortableOS();
}
});
window.addEventListener("resize",function(){
desktopAppIds().forEach(function(appId,index){
var icon=$("[data-desktop-app='"+appId+"']");
if(!icon) return;
var position=getAppPosition(appId,index);

icon.style.left=position.x+"px";
icon.style.top=position.y+"px";

});
$all(".window").forEach(function(win){
if(win.classList.contains("maximized")) return;
var maximumLeft=Math.max(0,window.innerWidth-win.offsetWidth);
var maximumTop=Math.max(
  0,
  window.innerHeight-getTaskbarHeight()-win.offsetHeight
);

win.style.left=
  Math.max(0,Math.min(win.offsetLeft,maximumLeft))+"px";

win.style.top=
  Math.max(0,Math.min(win.offsetTop,maximumTop))+"px";

});
});
$("#stickyNote").value=loadData("stickyNote","");
$("#stickyNote").oninput=function(event){
saveData("stickyNote",event.target.value);
};
applySettings();
renderLaunchers();
updateClock();
setInterval(updateClock,1000);
if(settings.startupNotification){
notify(
"CodeCanvas OS",
"CodeCanvas Embedder is installed. Use App Manager to choose whether each app opens inside the OS or in about:blank."
);
}
if(settings.startupApp && apps[settings.startupApp]){
setTimeout(function(){
launchApp(settings.startupApp);
},350);
}
})();
</script>
</body>
</html>
